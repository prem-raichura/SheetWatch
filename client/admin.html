<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#F6F7F9" />
    <meta name="robots" content="noindex, nofollow" />
    <script>
      // Apply stored appearance before first paint to avoid theme flash. Reads
      // the same key the app writes, so a staffer's theme carries over — but
      // via localStorage only, with no JS coupling to the app bundle.
      (function () {
        try {
          var p = JSON.parse(localStorage.getItem("sw:prefs") || "{}").appearance || {};
          var dark =
            p.theme === "dark" ||
            (p.theme !== "light" && matchMedia("(prefers-color-scheme: dark)").matches);
          var h = document.documentElement;
          h.classList.toggle("dark", dark);
          if (p.accent) h.style.setProperty("--accent-base", p.accent);
        } catch (e) {}
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <title>SheetWatch Ops</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/admin.tsx"></script>
  </body>
</html>
