# Hetzner VM deployment — the worker and its Redis, nothing else.
#
#   cp .env.example .env.production   # fill it in, see DEPLOY.md §5
#   docker compose up -d --build
#   docker compose logs -f worker
#
# Postgres is Neon, so this is two containers. Neither publishes a port: Redis
# is reachable only on the compose network and the worker only makes outbound
# connections, so the VM needs no inbound firewall rule beyond SSH.

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # Persist so a restart doesn't drop the repeatable job schedulers. Losing
    # them is survivable — the worker's reconcile rebuilds every one within a
    # minute — but there's no reason to make it re-derive on every reboot.
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  worker:
    build: .
    image: sheetwatch-worker
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    env_file: .env.production
    # The worker drains in-flight jobs and writes a final "stopped" heartbeat on
    # SIGTERM; its own hard cap is 15s, so give it room before docker SIGKILLs.
    stop_grace_period: 30s
    environment:
      NODE_ENV: production
      WORKER_MODE: bullmq
      # Overrides whatever .env.production says — Redis lives on the compose
      # network under its service name, never on localhost or a public address.
      REDIS_URL: redis://redis:6379
      # Surfaces on the ops dashboard so "which build is running?" is
      # answerable, and so worker-vs-API version skew is visible:
      #   GIT_COMMIT_SHA=$(git rev-parse --short HEAD) docker compose up -d --build
      # (`docker compose up -e …` is not a thing — -e belongs to `docker run`.)
      GIT_COMMIT_SHA: ${GIT_COMMIT_SHA:-}
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  redis-data:
